name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - main
    paths-ignore:
    - LICENSE
    - README.md
    - 'configs**'
    - '**.sln'
    - '**.vcxproj**'
  pull_request:
    paths-ignore:
    - LICENSE
    - README.md
    - 'configs**'
    - '**.sln'
    - '**.vcxproj**'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    env:
        HL2SDKCS2: ${{ github.workspace }}/stfixes-metamod/sdk
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
          - os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: stfixes-metamod
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          # Pinned, not master: this is the build the API 18 port was validated
          # against, and Metamod's plugin ABI moves without warning.
          ref: 05c5c63a9d595cb84021c3a51fe38366ba4a12a5
          path: mmsource-2.0
          submodules: recursive

      # core/ISmmPlugin.h includes "khook.hpp" as a sibling, but Metamod keeps
      # KHook in third_party/khook/include. Without this the build dies with
      # "fatal error: 'khook.hpp' file not found" on the first translation unit.
      - name: Stage KHook headers
        shell: bash
        run: |
          khook=mmsource-2.0/third_party/khook/include
          test -f "$khook/khook.hpp" || { echo "KHook headers missing at $khook"; exit 1; }
          cp "$khook/khook.hpp" mmsource-2.0/core/khook.hpp
          cp -r "$khook/khook" mmsource-2.0/core/khook

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install setuptools
        if: matrix.os == 'windows-latest'
        run: python -m pip install setuptools

      - name: Install AMBuild
        run: |
          cd ambuild && python setup.py install && cd ..

      - name: Install Clang 16
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt update && apt install -y clang-16
          ln -sf /usr/bin/clang-16 /usr/bin/clang && ln -sf /usr/bin/clang++-16 /usr/bin/clang++

      - name: Build
        working-directory: stfixes-metamod
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: stfixes-metamod/build/package
